services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: kith_user
      POSTGRES_PASSWORD: kith_password
      POSTGRES_DB: kith_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kith_user -d kith_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 app:app --workers 3
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
