{% extends 'base.html' %}
{% block content %}
  <h2>Admin: Users</h2>
  <div style="margin-bottom: 1rem;">
    <a href="{{ url_for('admin') }}" class="btn-inline">Back to admin dashboard</a>
  </div>

  <form method="get" style="margin: .8rem 0;">
    <input type="text" name="q" value="{{ query }}" placeholder="Search username" />
    <button type="submit">Search</button>
  </form>

  <table class="needs-table">
    <thead>
      <tr><th>ID</th><th>Username</th><th>Role</th><th>Created</th><th>Actions</th></tr>
    </thead>
    <tbody>
      {% for u in users %}
        <tr>
          <td>{{ u.id }}</td>
          <td><a href="{{ url_for('admin_edit_user', user_id=u.id) }}">{{ u.username }}</a></td>
          <td>{{ u.role }}</td>
          <td>{{ u.created_at }}</td>
          <td>
            <a href="{{ url_for('profile', username=u.username) }}">Profile</a>
            <a href="{{ url_for('admin_edit_user', user_id=u.id) }}" style="margin-left: 6px;">Edit</a>
            <form method="post" action="{{ url_for('admin_delete_user', user_id=u.id) }}" style="display:inline; margin-left: 6px;" onsubmit="return confirm('Delete this user and disassociate their requests?');">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
              <button type="submit" class="btn-inline">Delete</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
