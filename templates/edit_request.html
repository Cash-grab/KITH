{% extends 'base.html' %}
{% block content %}
  <h2>Edit Need</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-messages">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <label>Name of requester <span class="required">*</span><input name="name" value="{{ need.name }}" required /></label>
    <label>Description <span class="required">*</span><textarea name="description" rows="3" required>{{ need.description }}</textarea></label>
    <label>Type <select name="need_type">
      <option value="medical" {% if need.need_type == 'medical' %}selected{% endif %}>Medical</option>
      <option value="food" {% if need.need_type == 'food' %}selected{% endif %}>Food</option>
      <option value="shelter" {% if need.need_type == 'shelter' %}selected{% endif %}>Shelter</option>
      <option value="childcare" {% if need.need_type == 'childcare' %}selected{% endif %}>Childcare</option>
      <option value="other" {% if need.need_type == 'other' %}selected{% endif %}>Other</option>
    </select></label>
    <label>Contact information <span class="required">*</span><input name="contact_info" value="{{ need.contact_info or '' }}" required placeholder="phone/email" /></label>
    <label><input type="checkbox" name="emergency" {% if need.emergency %}checked{% endif %}/> Emergency priority (red)</label>
    <div class="row-inline">
      <label>Latitude <span class="required">*</span><input id="lat" name="latitude" value="{{ need.latitude }}" required type="text" /></label>
      <label>Longitude <span class="required">*</span><input id="lng" name="longitude" value="{{ need.longitude }}" required type="text" /></label>
    </div>
    <div class="small-map-wrapper">
      <p>Drag marker to adjust location:</p>
      <div id="location-map" class="small-map"></div>
    </div>
    <button type="submit">Save changes</button>
  </form>

  <script>
    const initialLat = parseFloat('{{ need.latitude }}');
    const initialLng = parseFloat('{{ need.longitude }}');
    const locationMap = L.map('location-map').setView([initialLat, initialLng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(locationMap);

    let currentMarker = L.marker([initialLat, initialLng], { draggable: true }).addTo(locationMap);

    function setMarker(lat, lng) {
      currentMarker.setLatLng([lat, lng]);
      locationMap.setView([lat, lng], 13);
      locationMap.invalidateSize();
    }

    function updateFieldsFromMarker() {
      const latlng = currentMarker.getLatLng();
      document.getElementById('lat').value = latlng.lat.toFixed(6);
      document.getElementById('lng').value = latlng.lng.toFixed(6);
    }

    function updateMarkerFromFields() {
      const lat = parseFloat(document.getElementById('lat').value);
      const lng = parseFloat(document.getElementById('lng').value);
      if (Number.isFinite(lat) && Number.isFinite(lng)) {
        setMarker(lat, lng);
      }
    }

    currentMarker.on('dragend', updateFieldsFromMarker);
    document.getElementById('lat').addEventListener('change', updateMarkerFromFields);
    document.getElementById('lng').addEventListener('change', updateMarkerFromFields);

    setTimeout(() => { locationMap.invalidateSize(); }, 250);
  </script>
{% endblock %}
